name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flatpak-build:
    name: Flatpak Build (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:9a7383aad71e6e966f120330d5a16ed99a2f41a68e36cc2fd1625bc635420707  # gnome-50
      options: --privileged
    strategy:
      matrix:
        target:
          - id: flatpak-x86_64
            arch: x86_64
            runner: ubuntu-24.04
          - id: flatpak-aarch64
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: dev.skillless.Scanline.${{ matrix.target.arch }}.flatpak
          manifest-path: dev.skillless.Scanline.json
          arch: ${{ matrix.target.arch }}
          cache-key: flatpak-builder-${{ matrix.target.arch }}-${{ github.sha }}

  macos-build:
    name: macOS DMG (aarch64)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Build .app
        run: nix build .#scanline-darwin-app
      - name: Build DMG
        run: ./scripts/build-dmg.sh ./result/Scanline.app dev.skillless.Scanline.aarch64.dmg
      - name: Upload Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev.skillless.Scanline.aarch64.dmg
          path: dev.skillless.Scanline.aarch64.dmg
          retention-days: 7
